snowplow_web:
  target: embucket
  outputs:
    embucket:
      type: embucket
      function_arn: "{{ env_var('EMBUCKET_FUNCTION_ARN') }}"
      account: "{{ env_var('EMBUCKET_ACCOUNT', 'embucket') }}"
      user: "{{ env_var('EMBUCKET_USER', 'embucket') }}"
      password: "{{ env_var('EMBUCKET_PASSWORD', 'embucket') }}"
      database: demo
      schema: public_snowplow_manifest
      threads: 1
